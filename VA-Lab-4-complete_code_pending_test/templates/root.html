<html>
<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        select {
            background-color: gray;
        }
    </style>
</head>
<body>
    <div id="interactions-container">
        <div id="dropdown-container">
            <label for="grouper"> X: </label>
            <select id="grouper" onchange="update_aggregate(this.value, 'grouper')">
                {% for group in groups %}
                    <option value="{{group}}">{{ group }}</option>
                {% endfor %}
            </select>
            <label for="value"> Y: </label>
            <select id="value" onchange="update_aggregate(this.value, 'value')">
                {% for value in values %}
                    <option value="{{value}}">{{ value }}</option>
                {% endfor %}
            </select>
            <label for="agg"> Aggregate: </label>
            <select id="agg" onchange="update_aggregate(this.value, 'agg')">
                {% for agg in aggs %}
                    <option value="{{agg}}">{{ agg }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div id="plot-container"></div>
    <div id="filters-container">
        {% for group in groups %}
            <label for="{{group}}-filter"> {{ group }} </label>
            <select id="{{group}}-filter" onchange="update_filter(this.value, '{{ group }}')">
                <option value="All">All</option>
                {% for v in group_filters[group] %}
                    <option value="{{v}}">{{ v }}</option>
                {% endfor %}
            </select>
        {% endfor %}
    </div>

    <script type="text/javascript" src="{{ url_for('static', filename='script.js') }}"></script> 
</body>
</html>
